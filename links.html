<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nuestros canales</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Todos nuestros canales de clips y shorts en un solo lugar.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="icon.png">
<style>
  :root{--bg:#0f1117;--card:#191c24;--line:#262a35;--ink:#f2f4f8;--muted:#9aa3b2;
        --yt:#ff3b30;--ig1:#f09433;--ig2:#dc2743;--ig3:#bc1888;--accent:#6d4aff}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       background:radial-gradient(1200px 600px at 50% -10%,#1b1740,var(--bg)) no-repeat,var(--bg);
       color:var(--ink);min-height:100vh}
  .wrap{max-width:480px;margin:0 auto;padding:2.4rem 1.1rem 3rem}
  header{text-align:center;margin-bottom:1.8rem}
  .logo{width:84px;height:84px;border-radius:22px;margin:0 auto .9rem;display:block}
  h1{font-size:1.4rem;margin:.2rem 0 .25rem;letter-spacing:-.01em}
  .tag{color:var(--muted);font-size:.95rem;margin:0}
  .ch{background:var(--card);border:1px solid var(--line);border-radius:16px;
      padding:1rem 1.1rem;margin:.9rem 0}
  .ch h2{font-size:1.05rem;margin:0 0 .7rem;display:flex;align-items:center;gap:.5rem}
  .ch .dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--accent);display:inline-block}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
  a.btn{display:flex;align-items:center;justify-content:center;gap:.45rem;text-decoration:none;
        color:#fff;font-weight:600;font-size:.95rem;padding:.7rem .8rem;border-radius:11px;
        transition:transform .06s ease,filter .15s ease}
  a.btn:active{transform:scale(.98)}
  a.btn:hover{filter:brightness(1.08)}
  a.yt{background:var(--yt)}
  a.ig{background:linear-gradient(45deg,var(--ig1),var(--ig2) 55%,var(--ig3))}
  a.full{grid-column:1 / -1}
  .ic{width:1.15rem;height:1.15rem;flex:none}
  footer{text-align:center;color:var(--muted);font-size:.82rem;margin-top:1.8rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="icon.png" alt="">
    <h1>Nuestros canales</h1>
    <p class="tag">Los mejores clips y momentos, todos juntos 🎬</p>
  </header>

  <div class="ch">
    <h2><span class="dot"></span>Clips Hispanos</h2>
    <div class="btns">
      <a class="btn yt" href="https://www.youtube.com/channel/UCs61_F0OSknE-XehlWVmNwQ">▶ YouTube</a>
      <a class="btn ig" href="https://instagram.com/clipshispanos.47">◎ Instagram</a>
    </div>
  </div>

  <div class="ch">
    <h2><span class="dot"></span>Clips Argentina</h2>
    <div class="btns">
      <a class="btn yt" href="https://www.youtube.com/@ClipsArgentina.47">▶ YouTube</a>
      <a class="btn ig" href="https://instagram.com/clipsargentina.47">◎ Instagram</a>
    </div>
  </div>

  <div class="ch">
    <h2><span class="dot"></span>Clips IRL</h2>
    <div class="btns">
      <a class="btn yt" href="https://www.youtube.com/@ClipsIRL.47">▶ YouTube</a>
      <a class="btn ig" href="https://instagram.com/clipsirl.47">◎ Instagram</a>
    </div>
  </div>

  <div class="ch">
    <h2><span class="dot"></span>What On Earth Is This</h2>
    <div class="btns">
      <a class="btn ig full" href="https://instagram.com/what.onearthisthat">◎ Instagram</a>
    </div>
  </div>

  <footer>© 2026 · Todos los clips pertenecen a sus creadores originales.</footer>
</div>
</body>
</html>
